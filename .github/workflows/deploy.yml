name: Deploy FirstEdu Backendd

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Copy files to EC2
      - name: Copy Project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "./*"
          target: "/home/ubuntu/firstedu-backend"

      # Deploy application
      - name: Deploy & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            mkdir -p /home/ubuntu/firstedu-backend
            cd /home/ubuntu/firstedu-backend

            echo "Current files:"
            ls -la

            echo "${{ secrets.ENV_FILE }}" > .env

            # Paper jobs write under temp/; keep dirs so worker can claim/persist.
            mkdir -p temp/paper-jobs temp/generation-jobs temp/confirmed-questions

            npm install

            # Resilient PM2 restart — avoids "Process with pid already exists"
            # when a stale PM2 god-daemon entry conflicts with restart.
            restart_or_start() {
              local name="$1"
              local entry="$2"
              pm2 stop "$name" >/dev/null 2>&1 || true
              pm2 delete "$name" >/dev/null 2>&1 || true
              pm2 start "$entry" --name "$name" --update-env
            }

            # API process (enqueues paper jobs when PAPER_JOB_RUNNER=worker)
            restart_or_start backend src/server.js

            # Dedicated paper worker — required when PAPER_JOB_RUNNER=worker
            # (API alone will leave jobs stuck in pending forever).
            restart_or_start paper-worker scripts/paper-job-worker.mjs

            # Ensure subject taxonomy under competitive exams (idempotent).
            node scripts/seed-competitive-exam-subjects.mjs || true

            pm2 save
            pm2 status

            sudo systemctl restart nginx

            echo "Deployment completed successfully"
